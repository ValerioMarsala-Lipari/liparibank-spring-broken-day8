spring:
  application:
    name: liparibank-day08
  profiles:
    active: dev

  datasource:
    url: jdbc:h2:mem:liparibankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8080

logging:
  level:
    root: INFO
    com.lipari.bank: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
